version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: ecom_db
    environment:
      POSTGRES_DB: ecom
      POSTGRES_USER: ecom_user
      POSTGRES_PASSWORD: ecom_pass
    ports:
      - "5433:5432"
    volumes:
      - ecom_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecom_user -d ecom"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ecom_postgres_data:
